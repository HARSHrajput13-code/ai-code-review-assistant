# Pull-request validation (CIS §22.3, D-96).
# PR-00 provides the `commits` check. PR-01 adds the `backend` and `frontend` checks.
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  commits:
    name: commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate PR title and commit subjects (Conventional Commits 1.0.0, CIS §22.4)
        shell: bash
        env:
          # Untrusted values are passed through the environment, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|test|build|ci|refactor|perf|style|chore)(\([a-z0-9-]+\))?!?: [a-z0-9].{0,70}[^.]$'
          vague='^(change|changes|update|updates|update files|final changes|fix stuff|stuff|misc|work|wip|setup stuff|implemented m[0-9]+)$'
          status=0
          check() {
            local kind="$1" message="$2"
            if ! printf '%s\n' "$message" | grep -Eq "$pattern"; then
              echo "::error::$kind is not a valid Conventional Commit header (CIS §22.4): $message"
              status=1
            elif printf '%s\n' "${message#*: }" | grep -Eiq "$vague"; then
              echo "::error::$kind has a vague description (CIS §22.4): $message"
              status=1
            else
              echo "ok  $kind: $message"
            fi
          }
          check "PR title" "$PR_TITLE"
          # Merge commits are exempt (CIS §22.3).
          while IFS= read -r subject; do
            check "commit" "$subject"
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          exit "$status"

  backend:
    name: backend
    # The reference platform is Windows (CIS §21.1). Live-LLM tests never run in CI (CIS §20.1).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no floating major tag
        with:
          version: "0.12.23"  # the uv version in docs/evaluation/environment-record.json

      - name: Install Python 3.14.8
        run: uv python install 3.14.8

      - name: Install the locked environment (binary wheels only)
        run: uv sync --locked --no-build

      - name: Check dependency consistency
        run: uv pip check

      - name: Tests (architecture, tool contracts, runtime)
        run: uv run --locked pytest

      - name: Ruff
        run: uv run --locked ruff check

      - name: Ruff format
        run: uv run --locked ruff format --check

      - name: Mypy
        run: uv run --locked mypy

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
